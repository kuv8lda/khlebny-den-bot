name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t khlebny-den-bot:ci .
      - name: Check non-root user and writable data volume
        run: |
          docker run --rm --entrypoint python khlebny-den-bot:ci -c \
            'import os, pathlib, khlebny_bot.main; assert os.getuid() == 10001; pathlib.Path("/app/data/check").write_text("ok"); assert not pathlib.Path("/app/.env").exists()'
